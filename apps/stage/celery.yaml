ingress: false
autoUpdate: true
image:
  name: ghcr.io/desbordante/desbordante-server
  tag: 0.1.0
command: /celery
port: 8000
env:
  POSTGRES_USER: postgres
  POSTGRES_HOST: postgres-stage-service
  POSTGRES_DB: db
  POSTGRES_PORT: 5432
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_HOST: rabbitmq-stage-service
  RABBITMQ_PORT: 5672
  MINIO_ROOT_USER: admin
  MINIO_DEFAULT_BUCKETS: bucket:public
  MINIO_HOST: minio-stage-service
  MINIO_PORT: 9000
secrets:
  postgres-secret:
    POSTGRES_PASSWORD: password
  rabbitmq-secret:
    RABBITMQ_DEFAULT_PASS: password
  backend-secret:
    SECRET_KEY: password
  minio-secret:
    MINIO_ROOT_PASSWORD: password
