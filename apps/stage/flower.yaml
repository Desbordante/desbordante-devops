image:
  name: mher/flower
  tag: 2.0.1
subdomain: flower
command: celery
args: flower
port: 5555
env:
  - name: FLOWER_USER
    value: "admin"
  - name: RABBITMQ_DEFAULT_USER
    value: "guest"
  - name: RABBITMQ_HOST
    value: "rabbitmq-stage-service"
  - name: RABBITMQ_PORT
    value: "5672"
secrets:
  rabbitmq-secret:
    RABBITMQ_DEFAULT_PASS: password
  flower-secret:
    FLOWER_PASSWORD: password
