image:
  name: mher/flower
  tag: 2.0.1
subdomain: flower
command: celery
args:
  - "--broker=amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)//"
  - "flower"
  - "--basic_auth=$(FLOWER_USER):$(FLOWER_PASSWORD)"
port: 5555
env:
  FLOWER_USER: admin
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_HOST: rabbitmq-stage-service
  RABBITMQ_PORT: 5672
secrets:
  rabbitmq-secret:
    RABBITMQ_DEFAULT_PASS: password
  flower-secret:
    FLOWER_PASSWORD: password
